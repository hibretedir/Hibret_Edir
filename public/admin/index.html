<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hibret Edir — Member CRM & Invoice Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b0e14; --surface:#141820; --surface2:#1b2130; --surface3:#222840;
  --border:#252d3d; --border2:#2e3850;
  --accent:#e8a020; --accent2:#f0c060; --accent3:#c07010;
  --red:#e05040; --red-bg:rgba(224,80,64,.12); --red-border:rgba(224,80,64,.25);
  --green:#3dba6e; --green-bg:rgba(61,186,110,.1); --green-border:rgba(61,186,110,.25);
  --blue:#4a9eff; --blue-bg:rgba(74,158,255,.1);
  --muted:#5a6580; --muted2:#3e4a60; --text:#dde4f0; --text2:#a0aec0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}

/* ===== LAYOUT ===== */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ===== SIDEBAR ===== */
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.brand-logo{display:flex;align-items:center;gap:10px}
.logo-sq{width:36px;height:36px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#000;flex-shrink:0}
.brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:.3px}
.brand-sub{color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

.nav-section{padding:12px 8px 4px}
.nav-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 8px 6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:3px;transition:all .15s;color:var(--muted);font-size:12px;letter-spacing:.3px;margin-bottom:1px}
.nav-item:hover{background:var(--surface2);color:var(--text2)}
.nav-item.active{background:var(--surface3);color:var(--accent);border-left:2px solid var(--accent);padding-left:8px}
.nav-icon{font-size:14px;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--surface3);color:var(--muted);font-size:9px;padding:1px 6px;border-radius:0}
.nav-item.active .nav-badge{background:var(--accent);color:#000}

.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border)}
.sidebar-footer .sync-date{color:var(--muted);font-size:10px}

/* ===== TOPBAR ===== */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0}
.page-title{font-family:'Syne',sans-serif;font-weight:700;font-size:18px}
.page-sub{color:var(--muted);font-size:11px;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.kpi-chip{background:var(--surface2);border:1px solid var(--border);padding:6px 14px;display:flex;flex-direction:column;align-items:center}
.kpi-val{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}
.kpi-val.red{color:var(--red)}
.kpi-val.green{color:var(--green)}
.kpi-val.amber{color:var(--accent)}
.kpi-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px}

/* ===== CONTROLS ===== */
.controls{padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
input[type=text],select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 12px;outline:none;transition:border-color .2s;min-width:0}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;padding-left:30px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.btn{background:transparent;border:1px solid var(--border);color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;padding:7px 14px;cursor:pointer;transition:all .2s;letter-spacing:.3px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:500}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{border-color:var(--red);color:var(--red)}
.result-count{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}

/* ===== FILTER TABS ===== */
.filter-tabs{display:flex;gap:1px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.ftab{padding:10px 16px;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px}
.ftab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ftab:hover:not(.active){color:var(--text2)}
.ftab-badge{background:var(--surface2);font-size:9px;padding:1px 6px;color:var(--muted)}
.ftab.active .ftab-badge{background:var(--accent);color:#000}

/* ===== TABLE ===== */
.table-area{flex:1;padding:0 28px 40px;overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:16px}
thead tr{border-bottom:2px solid var(--border)}
th{font-family:'Syne',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 12px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;animation:fadeIn .25s ease both}
tbody tr:hover{background:var(--surface)}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
td{padding:10px 12px;vertical-align:middle}
.member-num{color:var(--muted);font-size:11px}
.member-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:600}
.member-full{color:var(--muted);font-size:10px;margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-line{font-size:11px;color:var(--text2);margin-bottom:2px}
.contact-line.email{color:var(--blue);font-size:10px}
.contact-line.no-email{color:var(--muted);font-style:italic;font-size:10px}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;font-size:10px;letter-spacing:.3px}
.status-pill.active{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.status-pill.not-active{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.status-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.inv-count{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
.inv-count.has-unpaid{color:var(--red)}
.inv-count.all-paid{color:var(--green)}
.inv-count.none{color:var(--muted)}
.tag{display:inline-block;background:var(--surface3);color:var(--accent2);font-size:9px;padding:2px 7px;border-left:2px solid var(--accent);margin:1px}
.action-btns{display:flex;gap:6px}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:4px 9px;cursor:pointer;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;padding:60px 0;color:var(--muted)}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);width:680px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* Member detail modal */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-field{display:flex;flex-direction:column;gap:5px}
.detail-field.full{grid-column:1/-1}
.field-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.field-value{color:var(--text);font-size:13px}
.field-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 10px;width:100%;outline:none}
.field-input:focus{border-color:var(--accent)}
.section-divider{grid-column:1/-1;border-top:1px solid var(--border);padding-top:14px;margin-top:2px}
.section-head{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}

/* Invoice rows inside modal */
.inv-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);margin-bottom:6px;border-left:3px solid var(--border2)}
.inv-row.unpaid{border-left-color:var(--red)}
.inv-row.paid{border-left-color:var(--green)}
.inv-event{font-size:11px;color:var(--accent2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-date{font-size:10px;color:var(--muted)}
.inv-amt{font-family:'Syne',sans-serif;font-weight:700;font-size:13px}
.inv-amt.red{color:var(--red)}
.inv-amt.green{color:var(--green)}

/* ===== INVOICE VIEW ===== */
.event-banner{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:6px}
.event-dot{width:10px;height:10px;background:var(--accent);flex-shrink:0}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .sidebar{width:48px;overflow:hidden}
  .sidebar-brand .brand-name,.sidebar-brand .brand-sub,.nav-item span,.nav-label,.sidebar-footer{display:none}
  .nav-icon{margin:0 auto}
  .kpi-chip{display:none}
  .topbar{padding:12px 16px}
  .controls{padding:10px 16px}
  .table-area{padding:0 16px 30px}
  .filter-tabs{padding:0 16px}
}
</style>
</head>

// Runtime state
let memberEdits = {};  // id -> {email, mobile, notes, ...}
let paidInvoices = new Set();
let currentView = 'members';
let memberFilter = 'all';
let invFilter = 'all';
let memberSort = 'id_asc';
let invSort = 'inv_desc';
let memberSearch = '';
let invSearch = '';
let invEventFilter = '';

// Build invoice lookup by member name (PayPal name -> invoices)
function getMemberInvoices(member) {
  const paypal = member.paypal_name.toLowerCase();
  const first = member.first.toLowerCase();
  const last = member.last.toLowerCase();
  return INVOICES.filter(inv => {
    const n = inv.name.toLowerCase();
    return n === paypal || n.startsWith(first) && n.includes(last) || n === (first+' '+last);
  });
}

function getMemberById(id) {
  return MEMBERS.find(m => m.id === id);
}

function getMemberData(m) {
  const edits = memberEdits[m.id] || {};
  return Object.assign({}, m, edits);
}

// ===================== STATS =====================
function updateSidebarBadges() {
  const active = MEMBERS.filter(m => m.status==='Active').length;
  document.getElementById('nb-members').textContent = active;
  const unpaid = INVOICES.filter(i => !paidInvoices.has(i.invoice_num)).length;
  document.getElementById('nb-invoices').textContent = unpaid;
}

// ===================== VIEWS =====================
function switchView(v) {
  currentView = v;
  ['members','invoices','overview'].forEach(n => {
    document.getElementById('nav-'+n).classList.toggle('active', n===v);
  });
  render();
}

function render() {
  if (currentView==='members') renderMembers();
  else if (currentView==='invoices') renderInvoices();
  else renderOverview();
  updateSidebarBadges();
}

// =================== MEMBERS VIEW ===================
function getMemberFiltered() {
  let filtered = MEMBERS.filter(m => {
    if (memberFilter==='active' && m.status!=='Active') return false;
    if (memberFilter==='inactive' && m.status==='Active') return false;
    if (memberFilter==='no-email' && (getMemberData(m).email || m.status!=='Active')) return false;
    const d = getMemberData(m);
    const q = memberSearch.toLowerCase();
    if (q) {
      const hay = [m.id, d.first, d.last, d.full_name, d.email, d.mobile, d.home, d.address].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered.sort((a,b) => {
    const da=getMemberData(a), db=getMemberData(b);
    if (memberSort==='id_asc') return a.id-b.id;
    if (memberSort==='id_desc') return b.id-a.id;
    if (memberSort==='name_asc') return da.last.localeCompare(db.last);
    if (memberSort==='name_desc') return db.last.localeCompare(da.last);
    return 0;
  });
  return filtered;
}

function renderMemberRows(filtered) {
  const countEl = document.getElementById('memberResultCount');
  if (countEl) countEl.textContent = filtered.length + ' member' + (filtered.length!==1?'s':'');
  const tableArea = document.getElementById('memberTableArea');
  if (!tableArea) return;
  if (filtered.length === 0) {
    tableArea.innerHTML = '<div class="empty">No members match your search</div>';
    return;
  }
  if (!document.getElementById('memberTbody')) {
    tableArea.innerHTML = `<table>
      <thead><tr>
        <th>#</th><th>Member</th><th>Contact</th><th>Email</th><th>Address</th><th>Status</th><th>Invoices</th><th>Actions</th>
      </tr></thead>
      <tbody id="memberTbody"></tbody>
    </table>`;
  }
  const tbody = document.getElementById('memberTbody');
  let html = '';
  filtered.forEach((m, i) => {
    const d = getMemberData(m);
    const invs = getMemberInvoices(m);
    const unpaidInvs = invs.filter(inv => !paidInvoices.has(inv.invoice_num));
    const invClass = invs.length===0 ? 'none' : unpaidInvs.length>0 ? 'has-unpaid' : 'all-paid';
    const invLabel = invs.length===0 ? '—' : `${unpaidInvs.length} unpaid / ${invs.length} total`;
    html += `<tr style="animation-delay:${Math.min(i,30)*.015}s">
      <td><span class="member-num">#${m.id}</span></td>
      <td>
        <div class="member-name">${d.first} ${d.last}</div>
        <div class="member-full">${d.full_name}</div>
      </td>
      <td>
        ${d.home ? `<div class="contact-line">🏠 ${d.home}</div>` : ''}
        ${d.mobile ? `<div class="contact-line">📱 ${d.mobile}</div>` : ''}
      </td>
      <td>
        ${d.email ? `<div class="contact-line email">${d.email}</div>` : '<div class="contact-line no-email">⚠ no email</div>'}
      </td>
      <td style="font-size:11px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.address || '—'}</td>
      <td><span class="status-pill ${m.status==='Active'?'active':'not-active'}"><span class="status-dot"></span>${m.status}</span></td>
      <td><span class="inv-count ${invClass}">${invLabel}</span></td>
      <td>
        <div class="action-btns">
          <button class="icon-btn" onclick="openMemberDetail(${m.id})">View</button>
          ${unpaidInvs.length>0 ? `<button class="icon-btn" onclick="switchView('invoices');invSearch='${d.first} ${d.last}'">Invoices</button>` : ''}
        </div>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function renderMembers() {
  const main = document.getElementById('mainArea');
  const active = MEMBERS.filter(m=>m.status==='Active').length;
  const inactive = MEMBERS.filter(m=>m.status!=='Active').length;
  const noEmail = MEMBERS.filter(m=>m.status==='Active' && !getMemberData(m).email).length;

  // If page already rendered, just refresh tabs + rows without touching the search input
  if (document.getElementById('memberSearchBox')) {
    ['all','active','inactive','no-email'].forEach(f => {
      const el = document.getElementById('mftab-'+f);
      if (el) el.classList.toggle('active', memberFilter===f);
    });
    renderMemberRows(getMemberFiltered());

  // Full render only when switching to this view
  main.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Members CRM</div>
        <div class="page-sub">Hibret Edir · ${MEMBERS.length} total members</div>
      </div>
      <div class="topbar-right">
        <div class="kpi-chip"><div class="kpi-val green">${active}</div><div class="kpi-label">Active</div></div>
        <div class="kpi-chip"><div class="kpi-val red">${inactive}</div><div class="kpi-label">Inactive</div></div>
        <div class="kpi-chip"><div class="kpi-val amber">${noEmail}</div><div class="kpi-label">No Email</div></div>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="memberSearchBox" placeholder="Search name, email, phone, address..." value="${memberSearch}" oninput="memberSearch=this.value;renderMemberRows(getMemberFiltered())">
      </div>
      <select id="memberSortSel" onchange="memberSort=this.value;renderMemberRows(getMemberFiltered())">
        <option value="id_asc" ${memberSort==='id_asc'?'selected':''}>Member # ↑</option>
        <option value="id_desc" ${memberSort==='id_desc'?'selected':''}>Member # ↓</option>
        <option value="name_asc" ${memberSort==='name_asc'?'selected':''}>Last Name A→Z</option>
        <option value="name_desc" ${memberSort==='name_desc'?'selected':''}>Last Name Z→A</option>
      </select>
      <div class="result-count" id="memberResultCount"></div>
    </div>
    <div class="filter-tabs">
      <div class="ftab ${memberFilter==='all'?'active':''}" id="mftab-all" onclick="memberFilter='all';renderMembers()">All <span class="ftab-badge">${MEMBERS.length}</span></div>
      <div class="ftab ${memberFilter==='active'?'active':''}" id="mftab-active" onclick="memberFilter='active';renderMembers()">Active <span class="ftab-badge">${active}</span></div>
      <div class="ftab ${memberFilter==='inactive'?'active':''}" id="mftab-inactive" onclick="memberFilter='inactive';renderMembers()">Inactive/Out <span class="ftab-badge">${inactive}</span></div>
      <div class="ftab ${memberFilter==='no-email'?'active':''}" id="mftab-no-email" onclick="memberFilter='no-email';renderMembers()">Missing Email <span class="ftab-badge">${noEmail}</span></div>
    </div>
    <div class="table-area" id="memberTableArea"></div>
  `;

  renderMemberRows(getMemberFiltered());
}

// =================== MEMBER DETAIL MODAL ===================
let editingMemberId = null;
function openMemberDetail(id) {
  editingMemberId = id;
  const m = getMemberData(getMemberById(id));
  const invs = getMemberInvoices(getMemberById(id));
  const unpaid = invs.filter(i => !paidInvoices.has(i.invoice_num));

  document.getElementById('modalMemberName').textContent = `${m.first} ${m.last}`;
  document.getElementById('modalMemberSub').textContent = `Member #${m.id} · PayPal: ${m.paypal_name}`;

  const invHtml = invs.length===0 ? '<div style="color:var(--muted);font-size:12px">No invoices on file yet</div>' :
    invs.sort((a,b)=>b.invoice_num-a.invoice_num).map(inv => {
      const p = paidInvoices.has(inv.invoice_num);
      return `<div class="inv-row ${p?'paid':'unpaid'}">
        <div>
          <div class="inv-event">${inv.item}</div>
          <div class="inv-date">#${inv.invoice_num} · ${inv.date.split(' ')[0]}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="inv-amt ${p?'green':'red'}">$${inv.total.toFixed(2)}</span>
          ${p ? '<span style="color:var(--green);font-size:10px">✓ PAID</span>' :
            `<button class="icon-btn" onclick="markPaid(${inv.invoice_num})">Mark Paid</button>`}
        </div>
      </div>`;
    }).join('');

  document.getElementById('modalMemberBody').innerHTML = `
    <div class="detail-grid">
      <div class="detail-field"><div class="field-label">First Name</div><input class="field-input" id="ef_first" value="${m.first}"></div>
      <div class="detail-field"><div class="field-label">Last Name</div><input class="field-input" id="ef_last" value="${m.last}"></div>
      <div class="detail-field full"><div class="field-label">Full Name / Spouse</div><input class="field-input" id="ef_full_name" value="${m.full_name}"></div>
      <div class="detail-field"><div class="field-label">Home Phone</div><input class="field-input" id="ef_home" value="${m.home}"></div>
      <div class="detail-field"><div class="field-label">Mobile Phone</div><input class="field-input" id="ef_mobile" value="${m.mobile}"></div>
      <div class="detail-field full"><div class="field-label">Email Address</div><input class="field-input" id="ef_email" value="${m.email}"></div>
      <div class="detail-field full"><div class="field-label">Address</div><input class="field-input" id="ef_address" value="${m.address}"></div>
      <div class="detail-field full"><div class="field-label">PayPal Name</div><input class="field-input" id="ef_paypal_name" value="${m.paypal_name}"></div>
      <div class="detail-field full"><div class="field-label">Notes</div><input class="field-input" id="ef_notes" value="${m.notes}"></div>

      <div class="section-divider">
        <div class="section-head">Invoice History (${invs.length} invoices · ${unpaid.length} unpaid)</div>
        ${invHtml}
      </div>
    </div>
  `;
  document.getElementById('memberModal').classList.add('open');
}

function saveMemberEdit() {
  if (!editingMemberId) return;
  memberEdits[editingMemberId] = {
    first: document.getElementById('ef_first').value,
    last: document.getElementById('ef_last').value,
    full_name: document.getElementById('ef_full_name').value,
    home: document.getElementById('ef_home').value,
    mobile: document.getElementById('ef_mobile').value,
    email: document.getElementById('ef_email').value,
    address: document.getElementById('ef_address').value,
    paypal_name: document.getElementById('ef_paypal_name').value,
    notes: document.getElementById('ef_notes').value,
  };
  closeModal('memberModal');
  render();
}

function markPaid(invNum) {
  paidInvoices.add(invNum);
  if (editingMemberId) openMemberDetail(editingMemberId);  // refresh modal
  render();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// =================== INVOICES VIEW ===================
const EVENTS = [...new Set(INVOICES.map(i=>i.item))].sort();

function getInvFiltered() {
  let filtered = INVOICES.filter(inv => {
    if (invFilter==='unpaid' && paidInvoices.has(inv.invoice_num)) return false;
    if (invFilter==='paid' && !paidInvoices.has(inv.invoice_num)) return false;
    if (invEventFilter && inv.item!==invEventFilter) return false;
    const q = invSearch.toLowerCase();
    if (q) {
      const hay = `${inv.name} ${inv.email} ${inv.invoice_num} ${inv.item}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered.sort((a,b) => {
    if (invSort==='inv_desc') return b.invoice_num-a.invoice_num;
    if (invSort==='inv_asc') return a.invoice_num-b.invoice_num;
    if (invSort==='name_asc') return a.name.localeCompare(b.name);
    return b.date.localeCompare(a.date);
  });
  return filtered;
}

function renderInvRows(filtered) {
  const countEl = document.getElementById('invResultCount');
  if (countEl) countEl.textContent = filtered.length + ' invoice' + (filtered.length!==1?'s':'');
  const tableArea = document.getElementById('invTableArea');
  if (!tableArea) return;
  if (filtered.length === 0) {
    tableArea.innerHTML = '<div class="empty">No invoices match</div>';
    return;
  }
  if (!document.getElementById('invTbody')) {
    tableArea.innerHTML = `<table>
      <thead><tr>
        <th>Member</th><th>Invoice #</th><th>Event</th><th>Date</th><th>Amount</th><th>Status</th><th>Action</th>
      </tr></thead>
      <tbody id="invTbody"></tbody>
    </table>`;
  }
  const tbody = document.getElementById('invTbody');
  let html = '';
  let lastEvent = null;
  filtered.forEach((inv, i) => {
    const isPaid = paidInvoices.has(inv.invoice_num);
    const noEmail = inv.email==='NoEmailInFile@gmail.com';
    if (inv.item!==lastEvent) {
      html += `<tr><td colspan="7" style="padding:0">
        <div style="background:var(--surface2);padding:8px 12px;border-left:3px solid var(--accent);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between">
          <span>${inv.item}</span><span style="color:var(--muted);font-weight:400">${inv.date.split(' ')[0]}</span>
        </div></td></tr>`;
      lastEvent = inv.item;
    }
    html += `<tr style="animation-delay:${Math.min(i,30)*.015}s">
      <td>
        <div class="member-name" style="font-size:13px">${inv.name}</div>
        <div style="font-size:10px;color:${noEmail?'var(--muted)':'var(--blue)'};font-style:${noEmail?'italic':'normal'}">${noEmail?'⚠ no email':inv.email}</div>
      </td>
      <td style="color:var(--accent2);font-weight:500">#${inv.invoice_num}</td>
      <td><span style="background:var(--surface2);color:var(--accent2);font-size:10px;padding:3px 8px;border-left:2px solid var(--accent)">${inv.item}</span></td>
      <td style="color:var(--muted);font-size:11px">${inv.date.split(' ')[0]}</td>
      <td><span style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:${isPaid?'var(--green)':'var(--red)'}">${isPaid?'✓ ':''}$${inv.amount_due.toFixed(2)}</span></td>
      <td><span class="status-pill ${isPaid?'active':'not-active'}"><span class="status-dot"></span>${isPaid?'Paid':'Unpaid'}</span></td>
      <td>
        ${isPaid
          ? '<span style="color:var(--green);font-size:10px">✓ Marked Paid</span>'
          : `<button class="icon-btn" onclick="markPaid(${inv.invoice_num});renderInvRows(getInvFiltered())">Mark Paid</button>`}
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function renderInvoices() {
  const main = document.getElementById('mainArea');
  const unpaidCount = INVOICES.filter(i=>!paidInvoices.has(i.invoice_num)).length;
  const paidCount = paidInvoices.size;
  const totalOwed = INVOICES.filter(i=>!paidInvoices.has(i.invoice_num)).reduce((s,i)=>s+i.amount_due,0);

  // If already rendered, just refresh dynamic parts without destroying the search input
  if (document.getElementById('invSearchBox')) {
    // Update KPI chips
    const chips = document.querySelectorAll('#invKpiUnpaid,#invKpiPaid,#invKpiOwed');
    const u = document.getElementById('invKpiUnpaid');
    const p = document.getElementById('invKpiPaid');
    const o = document.getElementById('invKpiOwed');
    if (u) u.textContent = unpaidCount;
    if (p) p.textContent = paidCount;
    if (o) o.textContent = '$'+totalOwed.toLocaleString('en-US',{minimumFractionDigits:0});
    // Update tab badges
    ['all','unpaid','paid'].forEach(f => {
      const el = document.getElementById('iftab-'+f);
      if (el) el.classList.toggle('active', invFilter===f);
    });
    renderInvRows(getInvFiltered());
    updateSidebarBadges();
    return;
  }

  // Full render only on first load
  const evOptions = EVENTS.map(e=>`<option value="${e}" ${invEventFilter===e?'selected':''}>${e}</option>`).join('');

  main.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Invoice Dashboard</div>
        <div class="page-sub">PayPal Invoices · ${INVOICES.length} total</div>
      </div>
      <div class="topbar-right">
        <div class="kpi-chip"><div class="kpi-val red" id="invKpiUnpaid">${unpaidCount}</div><div class="kpi-label">Unpaid</div></div>
        <div class="kpi-chip"><div class="kpi-val green" id="invKpiPaid">${paidCount}</div><div class="kpi-label">Marked Paid</div></div>
        <div class="kpi-chip"><div class="kpi-val amber" id="invKpiOwed">$${totalOwed.toLocaleString('en-US',{minimumFractionDigits:0})}</div><div class="kpi-label">Outstanding</div></div>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="invSearchBox" placeholder="Search name, email, invoice #..." value="${invSearch}" oninput="invSearch=this.value;renderInvRows(getInvFiltered())">
      </div>
      <select onchange="invEventFilter=this.value;renderInvRows(getInvFiltered())">
        <option value="">All Events</option>
        ${evOptions}
      </select>
      <select onchange="invSort=this.value;renderInvRows(getInvFiltered())">
        <option value="inv_desc" ${invSort==='inv_desc'?'selected':''}>Invoice # ↓</option>
        <option value="inv_asc" ${invSort==='inv_asc'?'selected':''}>Invoice # ↑</option>
        <option value="name_asc" ${invSort==='name_asc'?'selected':''}>Name A→Z</option>
        <option value="date_desc">Date ↓</option>
      </select>
      <div class="result-count" id="invResultCount"></div>
    </div>
    <div class="filter-tabs">
      <div class="ftab ${invFilter==='all'?'active':''}" id="iftab-all" onclick="invFilter='all';renderInvoices()">All <span class="ftab-badge">${INVOICES.length}</span></div>
      <div class="ftab ${invFilter==='unpaid'?'active':''}" id="iftab-unpaid" onclick="invFilter='unpaid';renderInvoices()">Unpaid <span class="ftab-badge">${unpaidCount}</span></div>
      <div class="ftab ${invFilter==='paid'?'active':''}" id="iftab-paid" onclick="invFilter='paid';renderInvoices()">Marked Paid <span class="ftab-badge">${paidCount}</span></div>
    </div>
    <div class="table-area" id="invTableArea"></div>
  `;

  renderInvRows(getInvFiltered());
}

// =================== OVERVIEW ===================
function renderOverview() {
  const main = document.getElementById('mainArea');
  const active = MEMBERS.filter(m=>m.status==='Active').length;
  const inactive = MEMBERS.filter(m=>m.status!=='Active').length;
  const withEmail = MEMBERS.filter(m=>getMemberData(m).email).length;
  const noEmail = active - MEMBERS.filter(m=>m.status==='Active' && getMemberData(m).email).length;
  const unpaid = INVOICES.filter(i=>!paidInvoices.has(i.invoice_num)).length;
  const totalOwed = INVOICES.filter(i=>!paidInvoices.has(i.invoice_num)).reduce((s,i)=>s+i.amount_due,0);

  // Events breakdown
  const events = {};
  INVOICES.forEach(inv => {
    if (!events[inv.item]) events[inv.item] = {total:0, unpaid:0, date:inv.date};
    events[inv.item].total++;
    if (!paidInvoices.has(inv.invoice_num)) events[inv.item].unpaid++;
  });

  const eventCards = Object.entries(events).sort((a,b)=>b[1].date.localeCompare(a[1].date)).map(([ev, d]) => `
    <div style="background:var(--surface);border:1px solid var(--border);padding:18px;cursor:pointer;transition:border-color .2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'" onclick="switchView('invoices');invEventFilter='${ev.replace(/'/g, "\'")}';invFilter='all'">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--accent2);margin-bottom:8px">${ev}</div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:12px">${d.date.split(' ')[0]}</div>
      <div style="height:3px;background:var(--border);margin-bottom:12px"><div style="height:100%;background:var(--red);width:${Math.round(d.unpaid/d.total*100)}%"></div></div>
      <div style="display:flex;gap:16px">
        <div><div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Unpaid</div><div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--red)">${d.unpaid}</div></div>
        <div><div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Total</div><div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--text)">${d.total}</div></div>
        <div><div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Owed</div><div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--accent)">$${(d.unpaid*110).toLocaleString()}</div></div>
      </div>
    </div>
  `).join('');

  // Members with most unpaid invoices
  const memberDebt = {};
  INVOICES.filter(i=>!paidInvoices.has(i.invoice_num)).forEach(inv => {
    if (!memberDebt[inv.name]) memberDebt[inv.name] = {count:0, amount:0};
    memberDebt[inv.name].count++;
    memberDebt[inv.name].amount += inv.amount_due;
  });
  const topDebtors = Object.entries(memberDebt).sort((a,b)=>b[1].count-a[1].count).slice(0,8);

  main.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Overview</div>
        <div class="page-sub">Hibret Edir · Summary Dashboard</div>
      </div>
    </div>
    <div style="padding:24px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
      <div style="background:var(--surface);border:1px solid var(--border);padding:18px">
        <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">Total Members</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--accent)">${MEMBERS.length}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:18px">
        <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">Active Members</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--green)">${active}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:18px">
        <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">Inactive/Out</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--red)">${inactive}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:18px">
        <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">With Email</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--blue)">${withEmail}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:18px">
        <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">Unpaid Invoices</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--red)">${unpaid}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);padding:18px">
        <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)">Total Owed</div>
        <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--red)">$${totalOwed.toLocaleString()}</div>
      </div>
    </div>

    <div style="padding:0 28px 24px">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Events with Outstanding Invoices</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">
        ${eventCards}
      </div>
    </div>

    <div style="padding:0 28px 40px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
      <div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Members with Outstanding Invoices</div>
        <div style="background:var(--surface);border:1px solid var(--border)">
          ${topDebtors.map(([name,d])=>`
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)">
              <div style="font-size:12px">${name}</div>
              <div style="display:flex;gap:12px;align-items:center">
                <span style="font-size:10px;color:var(--muted)">${d.count} invoice${d.count>1?'s':''}</span>
                <span style="font-family:'Syne',sans-serif;font-weight:700;color:var(--red)">$${d.amount.toFixed(0)}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Missing Email Addresses</div>
        <div style="background:var(--surface);border:1px solid var(--border);max-height:320px;overflow-y:auto">
          ${MEMBERS.filter(m=>m.status==='Active'&&!getMemberData(m).email).map(m=>`
            <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border)">
              <div>
                <div style="font-size:12px">${getMemberData(m).first} ${getMemberData(m).last}</div>
                <div style="font-size:10px;color:var(--muted)">#${m.id} · ${m.mobile||'no phone'}</div>
              </div>
              <button class="icon-btn" onclick="openMemberDetail(${m.id})">Edit</button>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

// =================== INIT ===================
render();
</script>
</body>
</html>
