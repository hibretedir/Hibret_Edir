[build]
  publish = "public"
  functions = "netlify/functions"

# Redirect rules
[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/application"
  to = "/application/index.html"
  status = 200

[[redirects]]
  from = "/application/*"
  to = "/application/index.html"
  status = 200

[[redirects]]
  from = "/waiting-list-status"
  to = "/#waitingliststatus"
  status = 302

[[redirects]]
  from = "/waiting-list-status/"
  to = "/#waitingliststatus"
  status = 302

[[redirects]]
  from = "/waiting-list-status/*"
  to = "/#waitingliststatus"
  status = 302

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
