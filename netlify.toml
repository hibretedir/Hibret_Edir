[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # PAYPAL_ENV is a mode flag (not a credential); "live" false-matches aria-live, liveNotifs, etc.
  SECRETS_SCAN_OMIT_KEYS = "PAYPAL_ENV"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "bcryptjs", "jsonwebtoken", "dotenv", "node-fetch"]

[functions."paypal-sync"]
  timeout = 60

# Hourly check; runs full sync at 9:00 AM & 6:00 PM America/Los_Angeles (see paypal-sync-scheduled.js)
[functions."paypal-sync-scheduled"]
  schedule = "0 * * * *"
  timeout = 30

[functions."paypal-sync-background"]
  timeout = 900

# Redirect rules
[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/application"
  to = "/application/index.html"
  status = 200

[[redirects]]
  from = "/application/*"
  to = "/application/index.html"
  status = 200

[[redirects]]
  from = "/waiting-list-status"
  to = "/#waitingliststatus"
  status = 302

[[redirects]]
  from = "/waiting-list-status/"
  to = "/#waitingliststatus"
  status = 302

[[redirects]]
  from = "/waiting-list-status/*"
  to = "/#waitingliststatus"
  status = 302

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
