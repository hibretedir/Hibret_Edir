[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # PAYPAL_ENV is a mode flag (not a credential); "live" false-matches aria-live, liveNotifs, etc.
  # SENDGRID_REPLY_TO / BOARD_NOTIFY_EMAIL / SENDGRID_FROM_EMAIL are public addresses (also in docs/notify.js).
  SECRETS_SCAN_OMIT_KEYS = "PAYPAL_ENV,SENDGRID_REPLY_TO,BOARD_NOTIFY_EMAIL,SENDGRID_FROM_EMAIL"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "bcryptjs", "jsonwebtoken", "dotenv", "node-fetch"]

[functions."paypal-sync"]
  timeout = 60

# Hourly trigger for paypal-sync-scheduled (Netlify cron is UTC-only).
# Netlify UI shows "Every hour" — that is intentional. PayPal sync runs ONLY at
# 9:00 AM and 6:00 PM America/Los_Angeles; all other hours exit immediately.
[functions."paypal-sync-scheduled"]
  schedule = "0 * * * *"
  timeout = 30

# Once daily (UTC 14:15 ≈ 7:15 AM Pacific) — imports Drive scans when
# APPLICATION_SCANS_ROOT is readable. On Netlify without Drive it no-ops.
# Local: also runs once/day via `npm run dev` / `npm run sync:scans:daily`.
[functions."application-scan-sync"]
  schedule = "15 14 * * *"
  timeout = 60

# Full batched PayPal pull (invoked by paypal-sync-scheduled or CRON_SECRET)

[functions."paypal-sync-background"]
  timeout = 900

# Redirect rules
[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/application"
  to = "/application/index.html"
  status = 200

[[redirects]]
  from = "/application/*"
  to = "/application/index.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/application/index.html"
  status = 302

[[redirects]]
  from = "/apply/*"
  to = "/application/index.html"
  status = 302

[[redirects]]
  from = "/waiting-list-status"
  to = "/#waitingliststatus"
  status = 302

[[redirects]]
  from = "/waiting-list-status/"
  to = "/#waitingliststatus"
  status = 302

[[redirects]]
  from = "/waiting-list-status/*"
  to = "/#waitingliststatus"
  status = 302

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
